name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test and deploy.
        type: string
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    container: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install zlib headers for the native gateway
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zlib1g-dev
      - run: moon update
      # The canary (canary.yml) runs the same script on newer toolchains.
      - run: scripts/gates.sh

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    container: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    environment: cloudflare
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install zlib headers for the native gateway
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zlib1g-dev
      - run: moon update
      # wrangler.toml's [build] step runs `moon build --target js .` first.
      - name: Deploy the Worker
        working-directory: src/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
        run: npx --yes wrangler@4 deploy
      # The Worker has no startup phase, so commands are synced here. The sync
      # diffs against Discord, so an unchanged declaration sends no writes.
      - name: Register commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: |
          test -n "$DISCORD_TOKEN" || { echo "DISCORD_TOKEN is not set" >&2; exit 1; }
          if [ -z "$DISCORD_GUILD_ID" ]; then unset DISCORD_GUILD_ID; fi
          moon run --target native --release src/register
